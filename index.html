<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside id="sidebar">
            <button id="sidebar-toggle">?</button>
            <nav>
                <ul>
                    <li><a href="#">Overview</a></li>
                    <li><a href="#">Wind Farm</a></li>
                    <li><a href="#">Anomalies</a></li>
                    <li><a href="#">Countires</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <h1>h1 word</h1>
            <div class="cards">
                <div class="card">
                    <h2>Map of area</h2>
                    <p class="stat">1,234</p>
                    <p>Active users in the system</p>
                </div>
                <div class="card">
                    <h2>Revenue</h2>
                    <p class="stat">$45,678</p>
                    <p>Monthly revenue generated</p>
                </div>
                <div class="card">
                    <h2>Orders</h2>
                    <p class="stat">892</p>
                    <p>Orders processed this month</p>
                </div>
                <div class="card">
                    <h2>Growth</h2>
                    <p class="stat">+23%</p>
                    <p>Compared to last month</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>

</html>
